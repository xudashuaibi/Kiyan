<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Kiyan's agent</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        #chat-box {
            border: 1px solid #ccc;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .user-msg {
            color: #1a5fb4;
            margin: 8px 0;
        }

        .ai-msg {
            color: #333;
            margin: 8px 0;
            white-space: pre-wrap;
        }

        #input-row {
            display: flex;
            gap: 8px;
        }

        #user-input {
            flex: 1;
            padding: 8px;
            font-size: 15px;
        }

        button {
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Kiyan's agent</h2>

    <div id="chat-box"></div>

    <div id="input-row">
        <input id="user-input" type="text" placeholder="输入你想问的话..." />
        <button id="send-btn">发送</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
